name: Complete repository upload

on:
  push:
    branches: [main]
    paths: [payload-v2.zip]

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack remaining project files
        run: |
          unzip -o payload-v2.zip
          rm -f payload.zip payload-v2.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete website source upload"
          for attempt in 1 2 3; do
            git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1
